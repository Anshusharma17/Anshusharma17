name: GitHub Profile 3D Contrib

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Write 3d-contrib settings file
        run: |
          mkdir -p .github/profile-3d-contrib
          cat > .github/profile-3d-contrib/settings.json <<'EOF'
          [
            {
              "type": "normal",
              "fileName": "profile-customize.svg",
              "backgroundColor": "#0B1020",
              "foregroundColor": "#C9D1D9",
              "strongColor": "#22D3EE",
              "weakColor": "#7D8AA0",
              "radarColor": "#22D3EE",
              "growingAnimation": true,
              "contribColors": [
                "#1B2240",
                "#0E5C6E",
                "#13899B",
                "#1BB6CC",
                "#22D3EE"
              ]
            },
            {
              "type": "rainbow",
              "fileName": "profile-rainbow-animate.svg",
              "backgroundColor": "#0B1020",
              "foregroundColor": "#C9D1D9",
              "strongColor": "#22D3EE",
              "weakColor": "#7D8AA0",
              "radarColor": "#22D3EE",
              "growingAnimation": true,
              "saturation": "70%",
              "contribLightness": [
                "20%",
                "40%",
                "50%",
                "60%",
                "70%"
              ],
              "duration": "8s",
              "hueRatio": 7
            }
          ]
          EOF

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-contrib/settings.json

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: refresh 3d contrib"
          git push
